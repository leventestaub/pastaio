# Web app -> GitHub Pages (https://leventestaub.github.io/pastaio/).
# Needs the repo variable PASTAIO_BACKEND_URL (the Vercel backend URL).
name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: [pastaio-app/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pastaio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pastaio-app/package-lock.json
      - run: npm ci
      - run: test -n "$PASTAIO_BACKEND_URL" && sh scripts/export-pages.sh
        env:
          PASTAIO_BACKEND_URL: ${{ vars.PASTAIO_BACKEND_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pastaio-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
