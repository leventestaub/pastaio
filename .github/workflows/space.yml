# Backend -> Hugging Face Docker Space. Pushes pastaio-backend/ as the Space repo.
# Needs the repo secret HF_TOKEN (write token) and the repo variable HF_SPACE
# (<hf-user>/<space-name>). GROQ_API_KEY lives only in the Space's own secrets.
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths: [pastaio-backend/**, .github/workflows/space.yml]
  workflow_dispatch:

concurrency:
  group: space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" && test -n "$HF_SPACE"
          cp -r pastaio-backend /tmp/space && cd /tmp/space
          { printf -- '---\ntitle: Pastaio API\nemoji: 🍝\ncolorFrom: red\ncolorTo: yellow\nsdk: docker\napp_port: 7860\npinned: false\n---\n\n'; cat README.md; } > README.tmp && mv README.tmp README.md
          git init -q -b main && git add -A
          git -c user.name="Levente Staub" -c user.email="levente.staub@gmail.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" main
