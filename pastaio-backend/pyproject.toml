[project]
name = "pastaio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "ollama>=0.4",
    "groq>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyyaml>=6",  # tests/test_kb.py rebuilds the KB from its YAML sources
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.vercel]
entrypoint = "app.vercel:app"
