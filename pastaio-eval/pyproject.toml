[project]
name = "pastaio-eval"
version = "0.1.0"
description = "Evaluation harness for the Pastaio agentic loop"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
