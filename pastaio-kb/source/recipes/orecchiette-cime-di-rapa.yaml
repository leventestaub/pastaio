recipe_id: orecchiette-cime-di-rapa
title: Orecchiette con le Cime di Rapa
shape_id: orecchiette
region_id: puglia
sauce_category_id: vegetable_based
description: >
  The flagship pasta dish of Puglia: orecchiette tossed with boiled
  cime di rapa (turnip greens), garlic, anchovy, and chili. The
  greens and pasta are cooked in the same water so the bitter
  vegetable infuses the orecchiette and the pasta starch thickens
  the greens.
cook_time_minutes: 25
serves: 4

ingredients:
  - name: orecchiette
    amount: 400
    unit: g
    notes: >
      Fresh handmade orecchiette is traditional. Good dried
      bronze-die orecchiette is an acceptable substitute.
  - name: cime_di_rapa
    amount: 1500
    unit: g
    notes: >
      Raw weight including stalks. After trimming to tender florets
      and young leaves the usable yield is roughly half.
  - name: acciuga_salata
    amount: 4
    unit: fillets
  - name: aglio
    amount: 2
    unit: cloves
  - name: peperoncino
    unit: q.b.
  - name: olio_extravergine_di_oliva
    unit: q.b.
  - name: sale
    unit: q.b.

steps:
  - order: 1
    text: >
      Trim the cime di rapa, keeping only the tender tops, florets,
      and youngest leaves. Wash thoroughly in cold water.
  - order: 2
    text: >
      Bring 5 litres of moderately salted water to a rolling boil.
  - order: 3
    text: >
      Add the cime di rapa to the boiling water. After a few
      minutes, add the orecchiette to the same pot. If the greens
      are very tender, reverse the order and add the pasta first to
      avoid the greens disintegrating before the pasta is cooked.
  - order: 4
    text: >
      In a wide pan, warm the olive oil with the crushed garlic
      cloves and chili. Add the anchovy fillets (boned, chopped,
      and crushed to a paste) and stir until they dissolve into
      the oil.
  - order: 5
    text: >
      Drain the pasta and greens together while the pasta is very
      al dente, reserving a little of the starchy cooking water.
  - order: 6
    text: >
      Transfer the pasta and greens to the pan with the anchovy
      oil. Toss thoroughly, adding cooking water as needed to
      coat. Finish with a drizzle of raw extra virgin olive oil
      if desired and serve immediately.

tags: [puglia, bitter_greens, anchovy, vegetable_based]

traditional_notes: >
  The Accademia Italiana della Cucina recipe published in
  Civiltà della Tavola No. 290 (February 2017) specifies cooking
  the cime di rapa and orecchiette together in the same pot, with
  no breadcrumbs. This is the canonical preparation. Toasted
  breadcrumbs (mollica fritta) are widely added in modern Pugliese
  households as a textural finish, but the Accademia codification
  omits them. The Accademia recipe also notes the alternative
  cooking order (orecchiette first, then greens) as a contingency
  when the greens are tender enough that simultaneous cooking
  risks reducing them to a paste before the pasta is done.

evidence_strength: accademia_published
confidence: directly_stated

