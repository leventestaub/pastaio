    source_url: https://www.accademiaitalianadellacucina.it/sites/default/files/allegati/CDT_319_Ott_2019.pdf
    source_type: accademia_publication
    source_tier: 2
    quoted_excerpt: >
      SALSA ALLE NOCI. Ingredienti (per condire spaghetti, tagliatelle
      o trenette per 4 persone): 160 g di gherigli di noce, 1 spicchio
      d'aglio, 30 g di grana padano, 70 g di olio extravergine d'oliva,
      20 g di pinoli, 160 g di latte intero, 30 g di mollica di pane
      raffermo, sale, pepe.
    excerpt_translation: >
      WALNUT SAUCE. Ingredients (to dress spaghetti, tagliatelle or
      trenette for 4 people): 160g walnut kernels, 1 garlic clove, 30g
      Grana Padano, 70g extra-virgin olive oil, 20g pine nuts, 160g
      whole milk, 30g stale bread crumb, salt, pepper.
    accessed_date: 2026-05-05

  - source_name: Mipaaf — Elenco dei Prodotti Agroalimentari Tradizionali (PAT) della Liguria
    source_url: https://www.agriligurianet.it/it/impresa/marchi-e-disciplinari/riconoscimento-di-nuovi-prodotti-tradizionali.html
    source_type: regional_government
    source_tier: 1
    quoted_excerpt: >
      Si chiamano tradizionali quei prodotti agroalimentari i cui
      metodi di lavorazione e conservazione risultano consolidati nel
