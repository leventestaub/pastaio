recipe_id: spaghetti-aglio-olio-e-peperoncino
title: Spaghetti aglio, olio e peperoncino
shape_id: spaghetti
region_id: campania
sauce_category_id: oil_based
description: >
  A definitive exercise in minimalism, relying on the precise
  thermal infusion of garlic and chili into extra-virgin olive oil.
  The infused oil is tossed vigorously with pasta and its starchy
  cooking water to create a light, cohesive sauce. Origin is
  Campanian; widely adopted in Lazio as the classic
  spaghettata di mezzanotte.
cook_time_minutes: 15
serves: 4

ingredients:
  - name: spaghetti
    amount: 400
    unit: g
    notes: >
      Accademia Italiana della Cucina codifies the Campanian variant
      using vermicelli rather than spaghetti; both formats are
      widely accepted.
  - name: aglio
    amount: 2
    unit: piece
  - name: olio_extravergine_di_oliva
    amount: 60
    unit: ml
  - name: peperoncino
    amount: 2
    unit: piece
  - name: prezzemolo
    unit: q.b.
    notes: >
      Optional and contested. The Accademia Italiana della Cucina's
      Campanian Vermicelli aglio e olio recipe explicitly includes
      abundant chopped parsley; minimalist purists omit it entirely.
  - name: sale_grosso
    unit: q.b.

steps:
  - order: 1
    text: >
      Bring a large pot of water to a rolling boil. Salt the water
      moderately and submerge the spaghetti.
  - order: 2
    text: >
      In a wide, cold skillet, combine the extra-virgin olive oil,
      sliced garlic, and chili peppers. Place over medium-low heat
      to slowly extract the flavors, ensuring the garlic does not
      brown.
    timer_seconds: 180
  - order: 3
    text: >
      Once the garlic turns a pale blond color, add a ladle of pasta
      cooking water to halt the cooking process and prevent
      bitterness.
  - order: 4
    text: >
      Drain the spaghetti two to three minutes before al dente,
      reserving additional starchy cooking water.
  - order: 5
    text: >
      Transfer the spaghetti directly to the skillet. Toss vigorously
      over medium-high heat, adding reserved water as needed, until
      the oil and water bind into a sauce.
  - order: 6
    text: >
      Remove from heat. Fold in the freshly chopped parsley if using,
      and serve immediately.

tags: [campania, vegetarian, quick, midnight_pasta]

traditional_notes: >
  The geographical origin of the dish is Campanian, though it has
  been aggressively adopted in Lazio as the classic 'spaghettata di
  mezzanotte' (midnight pasta). The primary orthodox debate centers
  on parsley. The Accademia Italiana della Cucina's codified
  Campanian variant uses vermicelli rather than spaghetti and
  explicitly includes abundant chopped parsley off the heat; many
  other Italian authorities omit parsley entirely to isolate the
  raw garlic pungency. Both positions are heavily defended in
  contemporary Italian cooking.

evidence_strength: contemporary_convention
confidence: synthesized_across_sources

