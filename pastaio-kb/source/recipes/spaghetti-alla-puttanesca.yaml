    source_type: accademia_publication
    source_tier: 2
    quoted_excerpt: >
      In una larga padella con l'olio, imbiondire l'aglio e il
      peperoncino e disfare le acciughe. Togliere l'aglio e
      aggiungere i pomodori, le olive spezzettate e i capperi.
    excerpt_translation: >
      In a wide pan with oil, brown the garlic and chili and break
      down the anchovies. Remove the garlic and add the tomatoes,
      chopped olives, and capers.
