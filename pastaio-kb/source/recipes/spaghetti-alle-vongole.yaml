      Accanto ai tradizionali spaghetti alle vongole e agli altri
      frutti di mare, gli chef locali si impegnano ad utilizzarlo
      in tanti altri piatti.
    excerpt_translation: >
      Alongside the traditional spaghetti with clams and other
      seafood, local chefs are committed to using it [the Piennolo
      tomato] in many other dishes.
    accessed_date: 2026-05-03
