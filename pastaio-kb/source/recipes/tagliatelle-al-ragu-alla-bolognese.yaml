recipe_id: tagliatelle-al-ragu-alla-bolognese
title: Tagliatelle al ragù alla bolognese
shape_id: tagliatelle
region_id: emilia_romagna
sauce_category_id: meat_based
description: >
  Bologna's meat ragù served on fresh egg tagliatelle: pancetta and beef cooked
  down with a soffritto, wine and a little tomato, then simmered for two to three
  hours. The Accademia Italiana della Cucina deposited an updated version of its
  recipe in 2023; the method below is adapted from it.
cook_time_minutes: 180
serves: 6

ingredients:
  - name: tagliatelle
    amount: 600
    unit: g
    notes: >
      Fresh egg pasta, 8 mm wide once cooked (Accademia).
  - name: polpa_di_manzo
    amount: 400
    unit: g
    notes: >
      Coarsely ground. The traditional cut is the cartella (diaphragm); otherwise
      collagen-rich front cuts such as shoulder or brisket. About 60% beef and 40%
      pork is an allowed variant.
  - name: pancetta_fresca
    amount: 150
    unit: g
    notes: >
      Fresh pork belly, sliced and minced.
  - name: cipolla_dorata
    amount: 60
    unit: g
    notes: >
      Chopped finely by hand; the recipe rules out a food processor.
  - name: carota
    amount: 60
    unit: g
  - name: sedano
    amount: 60
    unit: g
  - name: vino_rosso_o_bianco
    amount: 100
    unit: ml
    notes: >
      One glass, red or white.
  - name: passata_di_pomodoro
    amount: 200
    unit: g
  - name: concentrato_di_pomodoro
    amount: 15
    unit: g
    notes: >
      Double concentrate.
  - name: latte_intero
    amount: 100
    unit: ml
    notes: >
      Optional in the 2023 version; goes in halfway through the simmer.
  - name: brodo_di_carne
    unit: q.b.
    notes: >
      Light meat or vegetable broth, kept hot for topping up.
  - name: olio_extravergine_di_oliva
    amount: 45
    unit: ml
  - name: sale_fino
    unit: q.b.
  - name: pepe_nero
    unit: q.b.

substitutions:
  - original: pancetta_fresca
    substitutes: [pancetta_stesa, pancetta_arrotolata]
    notes: >
      The 2023 Accademia deposit explicitly allows stretched or rolled pancetta as
      replacements for fresh pancetta, but strictly forbids smoked pancetta.

steps:
  - order: 1
    text: >
      Warm the oil in a heavy pot about 25 cm wide and let the chopped pancetta
      melt into it over low heat.
  - order: 2
    text: >
      Stir in the onion, carrot and celery and let them soften slowly on
      medium-low. Keep stirring; the onion must not brown.
  - order: 3
    text: >
      Turn the heat up, add the beef and keep it moving for about 10 minutes,
      until its liquid is gone and it starts to sizzle.
  - order: 4
    text: >
      Add the wine and cook until it has evaporated, then stir in the
      concentrate and the passata.
  - order: 5
    text: >
      Add a cup of boiling broth, cover, and keep at the gentlest simmer for
      about 2 hours (up to 3). Add hot broth whenever it looks dry.
    timer_seconds: 7200
  - order: 6
    text: >
      For the milk version, pour it in halfway through and let it cook away.
      Season with salt and pepper at the end and toss with the cooked
      tagliatelle.

tags: [emilia_romagna, meat_sauce, sunday_pasta, accademia_codified]

traditional_notes: >
  On 20 April 2023 the Accademia Italiana della Cucina deposited an updated
  recipe at the Bologna Chamber of Commerce, replacing its 1982 version. It keeps
  the cartella as the traditional cut but allows front cuts, lists a 60/40
  beef-and-pork mix as an allowed variant, and makes milk optional. Not allowed:
  veal, smoked pancetta, pork alone, garlic, rosemary, parsley or other herbs and
  spices, brandy in place of wine, and flour to thicken.

evidence_strength: accademia_published
confidence: directly_stated

sources:
  - source_name: "Accademia Italiana della Cucina: Ricetta Aggiornata del Ragù alla Bolognese (2023)"
    source_url: "https://www.accademiaitalianadellacucina.it/sites/default/files/Rag%C3%B9%20alla%20bolognese%20-%20ricetta%20aggiornata%2020%20aprile%202023.pdf"
    source_type: accademia_publication
    source_tier: 2
    quoted_excerpt: >
      In mancanza, o in aggiunta, sono da preferire i tagli anteriori ricchi di
      collagene quali il muscolo, la spalla... VARIANTI AMMESSE: Carni miste:
      manzo (circa il 60%) e maiale (circa il 40%).
    excerpt_translation: >
      In the absence of, or in addition to, collagen-rich front cuts such as
      muscle, shoulder are to be preferred... ALLOWED VARIANTS: Mixed meats: beef
      (about 60%) and pork (about 40%).
    accessed_date: 2026-05-04
  - source_name: "Camera di Commercio di Bologna: Depositata la rinnovata ricetta"
    source_url: "https://www.bo.camcom.gov.it/it/blog/depositata-la-rinnovata-ricetta-del-vero-ragu-alla-bolognese"
    source_type: comune_disciplinare
    source_tier: 1
    quoted_excerpt: >
      VARIANTI NON AMMESSE. 1) Polpa di vitello; 2) Pancetta affumicata; 3) Solo
      carne di maiale; 4) Aglio, rosmarino, prezzemolo, altri aromi o spezie;
      5) Brandy... 6) Farina (per addensare).
    excerpt_translation: >
      VARIANTS NOT ALLOWED. 1) Veal pulp; 2) Smoked bacon; 3) Only pork meat;
      4) Garlic, rosemary, parsley, other flavorings or spices; 5) Brandy...
      6) Flour (to thicken).
    accessed_date: 2026-05-04
  - source_name: "Stefan Gourmet: The New Official Recipe for Ragù alla Bolognese"
    source_url: "https://stefangourmet.com/2025/03/16/the-new-official-recipe-for-ragu-alla-bolognese/"
    source_type: italian_culinary_magazine
    source_tier: 3
    quoted_excerpt: >
      It is interesting to note that milk has gone from a fixed ingredient to an
      optional one.
    excerpt_translation: ""
    accessed_date: 2026-05-04
